name: Bug report
description: Something in the Xbox app is broken (menu, installs, controls, crashes).
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.34.71
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach LocalState/rpcs3/RPCS3.log (Device Portal > File explorer), zipped if it is big.
