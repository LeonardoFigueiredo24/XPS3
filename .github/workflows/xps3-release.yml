name: XPS3 UWP release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*.*"

permissions:
  contents: write

concurrency:
  group: xps3-uwp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed development APPX
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out XPS3 and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify XPS3 integration
        run: python3 -B uwp/test_xps3_overlay.py

      - name: Read and validate release version
        shell: bash
        run: |
          version="$(sed -n 's/.*Version="\([0-9.]*\)".*/\1/p' uwp/package/AppxManifest.xml | head -n 1)"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          test -s "docs/releases/v${version}.md"
          echo "XPS3_VERSION=$version" >> "$GITHUB_ENV"
          echo "XPS3_APPX=dist/XPS3_${version}_x64.appx" >> "$GITHUB_ENV"

      - name: Restore cross-build cache
        id: cross-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-build/llvm-install
            .ci-build/llvm-native-lfs
            .ci-build/llvm-cross-lfs
            .ci-build/ffmpeg-build
            .ci-build/ffmpeg-install
            .ci-build/app-build
            .ci-build/sources
            .ci-build/packages
            .ci-toolchain-cache
            .ci-zig-cache
          key: xps3-uwp-${{ runner.os }}-${{ hashFiles('uwp/toolchain/build-llvm.sh', 'uwp/toolchain/build-ffmpeg.sh', 'uwp/xps3-docker-build-llvm.sh', 'uwp/xps3-docker-build-ffmpeg.sh', '3rdparty/llvm/llvm/llvm/CMakeLists.txt', '3rdparty/ffmpeg/configure') }}
          restore-keys: |
            xps3-uwp-${{ runner.os }}-

      - name: Prepare writable build directories
        run: |
          mkdir -p .ci-build .ci-toolchain-cache .ci-zig-cache dist
          chmod -R u+rwX .ci-build .ci-toolchain-cache .ci-zig-cache dist

      - name: Build reproducible UWP toolchain image
        run: docker build --tag xps3-uwp-builder:ci --file uwp/toolchain/Dockerfile.xps3-uwp .

      - name: Compile, package, sign, and validate XPS3
        run: |
          docker run --rm \
            --env XPS3_JOBS=2 \
            --env XPS3_BUILD_ROOT=/build \
            --env XPS3_SOURCE_ROOT=/src \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$GITHUB_WORKSPACE/.ci-build:/build" \
            --volume "$GITHUB_WORKSPACE/.ci-toolchain-cache:/xps3-cache" \
            --volume "$GITHUB_WORKSPACE/.ci-zig-cache:/root/.cache/zig" \
            xps3-uwp-builder:ci \
            bash -o pipefail -lc '
              chmod +x /src/uwp/*.sh /src/uwp/toolchain/*.sh
              /src/uwp/xps3-docker-build-llvm.sh 2>&1 | tee /build/xps3-llvm-build.log
              /src/uwp/xps3-docker-release.sh 2>&1 | tee /build/xps3-release-build.log
            '

      - name: Verify release payload
        shell: bash
        run: |
          test -s "$XPS3_APPX"
          test -s dist/Dependencies/x64/Microsoft.UI.Xaml.2.8.appx
          test -s dist/XPS3.Development.cer
          test -s dist/checksums.sha256
          (cd dist && sha256sum --check checksums.sha256)

      - name: Upload installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: XPS3-${{ env.XPS3_VERSION }}-x64-devmode
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: XPS3 ${{ env.XPS3_VERSION }} — Xbox Developer Mode
          body_path: docs/releases/${{ github.ref_name }}.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.XPS3_APPX }}
            dist/Dependencies/x64/Microsoft.UI.Xaml.2.8.appx
            dist/XPS3.Development.cer
            dist/checksums.sha256
            dist/INSTALL.md

      - name: Upload build evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: XPS3-${{ env.XPS3_VERSION || 'unknown' }}-build-evidence
          path: |
            .ci-build/evidence/
            .ci-build/xps3-llvm-build.log
            .ci-build/xps3-release-build.log
            .ci-build/app-build/xps3-cmake-configure.log
            .ci-build/app-build/xps3-ninja-build.log
            .ci-build/mesa-build/meson-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save cross-build cache
        if: always() && steps.cross-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-build/llvm-install
            .ci-build/llvm-native-lfs
            .ci-build/llvm-cross-lfs
            .ci-build/ffmpeg-build
            .ci-build/ffmpeg-install
            .ci-build/app-build
            .ci-build/sources
            .ci-build/packages
            .ci-toolchain-cache
            .ci-zig-cache
          key: xps3-uwp-${{ runner.os }}-${{ hashFiles('uwp/toolchain/build-llvm.sh', 'uwp/toolchain/build-ffmpeg.sh', 'uwp/xps3-docker-build-llvm.sh', 'uwp/xps3-docker-build-ffmpeg.sh', '3rdparty/llvm/llvm/llvm/CMakeLists.txt', '3rdparty/ffmpeg/configure') }}
