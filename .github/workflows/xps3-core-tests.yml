name: XPS3 core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparation-state-machine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build preparation state test
        shell: pwsh
        run: >-
          cl /nologo /std:c++20 /EHsc
          uwp/app/uwp_preparation.cpp
          uwp/app/test/preparation_test.cpp
          /Fe:preparation_test.exe
      - name: Run preparation state test
        shell: pwsh
        run: .\preparation_test.exe

  storage-model:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build storage model test
        shell: pwsh
        run: >-
          cl /nologo /std:c++20 /EHsc
          uwp/app/uwp_storage.cpp
          uwp/app/test/storage_test.cpp
          /Fe:storage_test.exe
      - name: Run storage model test
        shell: pwsh
        run: .\storage_test.exe

  content-verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build content verification test
        shell: pwsh
        run: >-
          cl /nologo /std:c++20 /EHsc
          uwp/app/uwp_preparation.cpp
          uwp/app/test/content_verification_test.cpp
          /Fe:content_verification_test.exe
      - name: Run content verification test
        shell: pwsh
        run: .\content_verification_test.exe

  static-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run XPS3 static integration checks
        run: python uwp/test_xps3_overlay.py
