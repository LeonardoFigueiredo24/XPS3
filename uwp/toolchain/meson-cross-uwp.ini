# Meson cross file for building Mesa (Dozen) for the Xbox UWP port with Zig.
# build-mesa-dzn.sh replaces the placeholders with the current checkout/build paths.
[binaries]
c = '@XPS3_TOOLCHAIN@/zig-cc'
cpp = '@XPS3_TOOLCHAIN@/zig-c++'
ar = '@XPS3_TOOLCHAIN@/zig-ar'
ranlib = '@XPS3_TOOLCHAIN@/zig-ranlib'
windres = 'llvm-windres'
strip = 'llvm-strip'
pkg-config = 'false'

[built-in options]
c_args = ['-Wno-error']
cpp_args = ['-Wno-error']
c_link_args = ['-L@XPS3_IMPLIBS@', '@XPS3_IMPLIBS@/mesa_sysstubs.o']
cpp_link_args = ['-L@XPS3_IMPLIBS@', '@XPS3_IMPLIBS@/mesa_sysstubs.o']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
