# Meson cross file for building Mesa (Dozen) for the Xbox UWP port with Zig.
# Paths are absolute to this checkout's uwp/toolchain; adjust when moving it.
[binaries]
c = '/home/claude/RPCS3/rpcs3/uwp/toolchain/zig-cc'
cpp = '/home/claude/RPCS3/rpcs3/uwp/toolchain/zig-c++'
ar = '/home/claude/RPCS3/rpcs3/uwp/toolchain/zig-ar'
ranlib = '/home/claude/RPCS3/rpcs3/uwp/toolchain/zig-ranlib'
windres = 'llvm-windres'
strip = 'llvm-strip'
pkg-config = 'false'

[built-in options]
c_args = ['-Wno-error']
cpp_args = ['-Wno-error']
c_link_args = ['-L/home/claude/uwp-port/build/uwp-implibs', '/home/claude/uwp-port/build/uwp-implibs/mesa_sysstubs.o']
cpp_link_args = ['-L/home/claude/uwp-port/build/uwp-implibs', '/home/claude/uwp-port/build/uwp-implibs/mesa_sysstubs.o']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'znver2'
endian = 'little'
